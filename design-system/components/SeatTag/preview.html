<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>SeatTag</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
</head>
<body>
<div id="root"></div>
<script>
var P = window.Passenger, h = React.createElement;
function App() {
  return h('div', { className: 'ps-demo' },
    h(P.SeatTag, { seat: '1-1' }),
    h(P.SeatTag, { seat: '2-1', name: 'Rani' }),
    h(P.SeatTag, { seat: '2-2' }),
    h(P.SeatTag, { seat: '3-2', name: 'Bima' }),
    h(P.SeatTag, { seat: '2-3', layout: [2, 3] }),
    h(P.SeatTag, { seat: '1-1', size: 'sm' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
