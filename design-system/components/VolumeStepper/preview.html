<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>VolumeStepper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
</head>
<body>
<div id="root"></div>
<script>
var P = window.Passenger, h = React.createElement;
function App() {
  var s = React.useState(60), v = s[0], setV = s[1];
  return h('div', { className: 'ps-demo', style: { alignItems: 'flex-start', gap: 'var(--space-8)' } },
    h(P.VolumeStepper, { value: v, onChange: setV }),
    h(P.VolumeStepper, { value: 40, locked: true }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
