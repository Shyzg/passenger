<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>TripNotice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
</head>
<body>
<div id="root"></div>
<script>
var P = window.Passenger, h = React.createElement;
var order = ['joined', 'waiting', 'no-device', 'rate-limited', 'locked', 'no-trip', 'premium', 'ended'];
function App() {
  return h('div', { className: 'ps-demo', style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', alignItems: 'stretch' } },
    order.map(function (p) {
      return h(P.TripNotice, { key: p, preset: p, action: p === 'no-device' ? h(P.Button, null, 'Cek lagi') : null });
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
