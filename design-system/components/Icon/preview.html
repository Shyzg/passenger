<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
</head>
<body>
<div id="root"></div>
<script>
var P = window.Passenger, h = React.createElement;
function App() {
  return h('div', { className: 'ps-demo', style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(88px, 1fr))', gap: 'var(--space-6) var(--space-2)' } },
    P.iconNames.map(function (n) {
      return h('figure', { key: n, style: { margin: 0, display: 'grid', justifyItems: 'center', gap: 'var(--space-2)', color: 'var(--ink)' } },
        h(P.Icon, { name: n, size: 28 }),
        h('figcaption', { className: 'meta', style: { color: 'var(--ink-muted)' } }, n));
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
